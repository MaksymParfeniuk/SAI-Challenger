name: sc-standalone-vpp

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "**" ]
    paths:
      - '.github/workflows/sc-standalone-vpp.yml'
      - 'dockerfiles/trixie/Dockerfile'
      - 'npu/vpp/**'
      - 'common/**'
      - 'cli/**'
      - 'scripts/**'
      - 'configs/**'
      - 'tests/**'
      - 'topologies/**'
      - 'setup.py'
      - 'build.sh'
      - 'run.sh'
      - 'exec.sh'
      - '.dockerignore'
      - 'sai.env'

jobs:
  build-sc-standalone-vpp:
    name: Build SAI Challenger VPP standalone image
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Update submodules
        run: git submodule update --init

      - name: Build VPP standalone Docker image
        run: ./build.sh -a vpp -t saivpp -o trixie

      - name: Start SAI-C in VPP standalone mode
        run: ./run.sh -a vpp -t saivpp -o trixie

      - name: Update SAI-C package
        run: ./exec.sh -a vpp -t saivpp --no-tty pip3 install /sai-challenger/common /sai-challenger

      - name: Run basic L2 tests
        run: ./exec.sh -a vpp -t saivpp --no-tty pytest --testbed=saivpp_standalone -v test_l2_basic.py -k "not test_l2_lag and not test_l2_lag_hash_seed"

      - name: Run basic L3 tests
        run: ./exec.sh -a vpp -t saivpp --no-tty pytest --testbed=saivpp_standalone -v test_dc_t1.py::test_basic_route